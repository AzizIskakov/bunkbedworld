<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tracker — habits & stats</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E📊%3C/text%3E%3C/svg%3E">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f8f7f4;
            --card: #fff;
            --primary: #1a1a2e;
            --accent: #e8b86d;
            --green: #2ecc71;
            --red: #e74c3c;
            --text: #2c2c2c;
            --muted: #888;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 80px;
        }
        .header {
            background: var(--primary);
            color: #fff;
            padding: 1rem 1.2rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 { font-size: 1.3rem; font-weight: 700; }
        .header .sub { font-size: 0.8rem; color: #aaa; margin-top: 0.1rem; }
        .page { display: none; padding: 1rem 1rem 6rem; max-width: 500px; margin: 0 auto; }
        .page.active { display: block; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #fff;
            border-top: 1px solid #e0ddd8;
            display: flex;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .nav-btn {
            flex: 1;
            padding: 0.7rem 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            border: none;
            background: none;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
        }
        .nav-btn .nav-icon { font-size: 1.4rem; }
        .nav-btn.active { color: var(--primary); }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }
        .card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--primary); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #2c2c4e; }
        .btn-accent { background: var(--accent); color: #1a1a2e; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        .btn-outline { background: none; border: 2px solid #e0ddd8; color: var(--text); }
        .btn-block { width: 100%; }

        input, select {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #e0ddd8;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        input[type="number"] { font-size: 1.2rem; }

        .row { display: flex; gap: 0.5rem; align-items: center; }
        .row .grow { flex: 1; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 1rem; }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); font-size: 0.85rem; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }

        .badge {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
        }

        /* Activity list */
        .alist { }
        .aitem {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 0;
            border-bottom: 1px solid #f0eeeb;
        }
        .aitem:last-child { border-bottom: none; }
        .aitem .aname { font-weight: 600; font-size: 0.95rem; }
        .aitem .aunit { font-size: 0.8rem; color: var(--muted); }
        .aitem .aicon { font-size: 1.5rem; margin-right: 0.7rem; }

        /* Quick log */
        .quick-nums {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            margin: 0.5rem 0;
        }
        .quick-nums button {
            padding: 0.8rem;
            border: 2px solid #e0ddd8;
            border-radius: 8px;
            background: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .quick-nums button:hover { border-color: var(--accent); background: #e8b86d20; }
        .quick-nums button:active { background: var(--accent); color: #fff; }

        /* Stats */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .num {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }

        .chart-container {
            margin: 1rem 0;
        }
        .chart-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        .chart-bar .date-label {
            font-size: 0.7rem;
            color: var(--muted);
            min-width: 2rem;
            text-align: right;
        }
        .chart-bar .bar-track {
            flex: 1;
            height: 20px;
            background: #f0eeeb;
            border-radius: 10px;
            overflow: hidden;
        }
        .chart-bar .bar-fill {
            height: 100%;
            border-radius: 10px;
            background: var(--accent);
            transition: width 0.3s;
            min-width: 4px;
        }
        .chart-bar .bar-val {
            font-size: 0.75rem;
            color: var(--muted);
            min-width: 3rem;
        }

        /* Manage */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
        }
        .modal h3 { margin-bottom: 1rem; }

        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: #e8b86d20;
            color: var(--primary);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }
        .empty-state .big-icon { font-size: 3rem; margin-bottom: 1rem; }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --card: #1e1e1e;
                --text: #e0e0e0;
                --muted: #888;
                --shadow: 0 2px 12px rgba(0,0,0,0.3);
                --primary: #2c2c4e;
            }
            body { background: var(--bg); }
            .bottom-nav { background: #1a1a2e; border-color: #2c2c4e; }
            .nav-btn { color: #666; }
            .nav-btn.active { color: var(--accent); }
            .card { background: var(--card); }
            input, select, .quick-nums button { background: #2c2c4e; border-color: #444; color: #e0e0e0; }
            .modal { background: #1e1e1e; }
            .chart-bar .bar-track { background: #2c2c4e; }
            .stat-card { background: var(--card); }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 Tracker</h1>
    <div class="sub" id="todayDate"></div>
</div>

<!-- LOG PAGE -->
<div class="page active" id="pageLog">
    <div class="card">
        <h3>Pick an activity</h3>
        <select id="logActivity" onchange="onLogActivityChange()"></select>
    </div>

    <div class="card" id="logInputCard">
        <h3 id="logLabel">How many?</h3>
        <input type="number" id="logValue" inputmode="numeric" min="0" step="1" value="1" onfocus="this.select()">
        <div class="quick-nums" id="quickNums"></div>
        <button class="btn btn-primary btn-block mt-1" onclick="submitLog()">+ Log It</button>
    </div>

    <div class="card">
        <h3>Today's logs</h3>
        <div id="todayLogs"><div class="text-muted">Nothing logged today.</div></div>
    </div>
</div>

<!-- STATS PAGE -->
<div class="page" id="pageStats">
    <div class="card">
        <h3>Activity</h3>
        <select id="statsActivity" onchange="renderStats()"></select>
    </div>
    <div class="stat-grid" id="statsGrid"></div>
    <div class="card mt-2" id="chartCard">
        <h3>Last 14 days</h3>
        <div class="chart-container" id="chartContainer"></div>
    </div>
</div>

<!-- MANAGE PAGE -->
<div class="page" id="pageManage">
    <div class="card">
        <div class="row" style="justify-content:space-between;">
            <h3>Your Activities</h3>
            <button class="btn btn-sm btn-accent" onclick="openAddModal()">+ New</button>
        </div>
        <div id="activityList"></div>
    </div>
    <div class="card">
        <h3>Data</h3>
        <button class="btn btn-outline btn-block btn-sm" onclick="exportData()">📤 Export Data</button>
        <button class="btn btn-outline btn-block btn-sm mt-1" onclick="document.getElementById('importInput').click()">📥 Import Data</button>
        <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-danger btn-block btn-sm mt-1" onclick="clearAllData()">🗑️ Clear All Data</button>
    </div>
</div>

<!-- ADD ACTIVITY MODAL -->
<div class="modal-overlay" id="addModal" onclick="if(event.target===this)closeAddModal()">
    <div class="modal">
        <h3>New Activity</h3>
        <input type="text" id="newName" placeholder="e.g. Pushups, Pages Read" style="margin-bottom:0.5rem">
        <input type="text" id="newUnit" placeholder="Unit (reps, pages, minutes...)">
        <div class="row mt-1">
            <button class="btn btn-primary" onclick="saveNewActivity()">Save</button>
            <button class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('log')">
        <span class="nav-icon">📝</span> Log
    </button>
    <button class="nav-btn" onclick="switchPage('stats')">
        <span class="nav-icon">📊</span> Stats
    </button>
    <button class="nav-btn" onclick="switchPage('manage')">
        <span class="nav-icon">⚙️</span> Manage
    </button>
</nav>

<script>
const STORAGE_KEY = 'tracker_data';

// Default activities
const DEFAULT_ACTIVITIES = [
    { id: 'pushups', name: 'Pushups', unit: 'reps', icon: '💪' },
    { id: 'squats', name: 'Squats', unit: 'reps', icon: '🦵' },
    { id: 'kk', name: 'KK', unit: 'pages', icon: '⬆️' },
    { id: 'cev', name: 'Cev', unit: 'bap', icon: '🏃' },
    { id: 'kitap', name: 'Kitap', unit: 'pages', icon: '📖' },
    { id: 'salauat', name: 'Salauat100', unit: 'ret', icon: '💪' },
    { id: 'th', name: 'TH Weekly', unit: 'ret', icon: '💧' }
];

let activities = [];
let logs = [];

function loadData() {
    try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            var data = JSON.parse(raw);
            activities = data.activities || [];
            logs = data.logs || [];
        }
    } catch(e) {}
    // Ensure defaults exist
    DEFAULT_ACTIVITIES.forEach(function(def) {
        if (!activities.some(function(a) { return a.id === def.id; })) {
            activities.push({ id: def.id, name: def.name, unit: def.unit, icon: def.icon });
        }
    });
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        activities: activities,
        logs: logs,
        updated: new Date().toISOString()
    }));
}

function getNextId() {
    var max = 0;
    activities.forEach(function(a) {
        var n = parseInt(a.id.replace(/^custom_/, ''));
        if (n > max) max = n;
    });
    return 'custom_' + (max + 1);
}

function today() {
    return new Date().toISOString().slice(0, 10);
}

function todayStr() {
    var d = new Date();
    var opts = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
    return d.toLocaleDateString('en-US', opts);
}

function getLogsForDate(dateStr) {
    return logs.filter(function(l) { return l.date === dateStr; });
}

function getActivityName(id) {
    var a = activities.find(function(a) { return a.id === id; });
    return a ? a.name : id;
}

function getActivityUnit(id) {
    var a = activities.find(function(a) { return a.id === id; });
    return a ? a.unit : '';
}

function getActivityIcon(id) {
    var a = activities.find(function(a) { return a.id === id; });
    return a && a.icon ? a.icon : '📌';
}

function populateActivitySelects() {
    var selects = ['logActivity', 'statsActivity'];
    selects.forEach(function(id) {
        var sel = document.getElementById(id);
        if (!sel) return;
        sel.innerHTML = '';
        activities.forEach(function(a) {
            var opt = document.createElement('option');
            opt.value = a.id;
            opt.textContent = a.name + ' (' + a.unit + ')';
            sel.appendChild(opt);
        });
    });
}

function onLogActivityChange() {
    var aid = document.getElementById('logActivity').value;
    var a = activities.find(function(a) { return a.id === aid; });
    if (a) {
        document.getElementById('logLabel').textContent = 'How many ' + a.unit + '?';
    }
    updateQuickNums();
}

function updateQuickNums() {
    var aid = document.getElementById('logActivity').value;
    var a = activities.find(function(a) { return a.id === aid; });
    var qn = document.getElementById('quickNums');
    qn.innerHTML = '';
    var nums = a && (a.id === 'read' || a.unit === 'pages') ? [5, 10, 20, 30, 50] :
               a && a.id === 'water' ? [1, 2, 4, 6, 8] :
               a && a.unit === 'minutes' ? [5, 10, 15, 30, 60] :
               [5, 10, 15, 20, 25, 30, 50];
    nums.slice(0, 7).forEach(function(n) {
        var btn = document.createElement('button');
        btn.textContent = n;
        btn.onclick = function() {
            document.getElementById('logValue').value = n;
        };
        qn.appendChild(btn);
    });
}

function submitLog() {
    var aid = document.getElementById('logActivity').value;
    var val = parseInt(document.getElementById('logValue').value) || 0;
    if (val <= 0) { alert('Enter a value greater than 0'); return; }

    logs.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        date: today(),
        activityId: aid,
        value: val
    });
    saveData();
    document.getElementById('logValue').value = val;
    renderTodayLogs();
    showToast('✅ Logged!');
}

function deleteLog(id) {
    logs = logs.filter(function(l) { return l.id !== id; });
    saveData();
    renderTodayLogs();
}

function renderTodayLogs() {
    var container = document.getElementById('todayLogs');
    var todayLogs = getLogsForDate(today());
    if (todayLogs.length === 0) {
        container.innerHTML = '<div class="text-muted">Nothing logged today.</div>';
        return;
    }
    var html = '';
    todayLogs.forEach(function(l) {
        html += '<div class="aitem">';
        html += '<div><span>' + getActivityIcon(l.activityId) + '</span> <strong>' + getActivityName(l.activityId) + '</strong>';
        html += ' <span class="badge">' + l.value + ' ' + getActivityUnit(l.activityId) + '</span></div>';
        html += '<button class="btn btn-sm btn-danger" onclick="deleteLog(\'' + l.id + '\')">✕</button>';
        html += '</div>';
    });
    container.innerHTML = html;
    // Update home icon
    document.querySelector('.nav-btn .nav-icon').textContent = todayLogs.length > 0 ? '✅' : '📝';
}

// ---- STATS ----
function renderStats() {
    var aid = document.getElementById('statsActivity').value;
    var logsFor = logs.filter(function(l) { return l.activityId === aid; });

    // Total
    var total = logsFor.reduce(function(s, l) { return s + l.value; }, 0);

    // Current streak
    var streak = 0;
    var d = new Date();
    while (true) {
        var ds = d.toISOString().slice(0, 10);
        if (logsFor.some(function(l) { return l.date === ds; })) {
            streak++;
            d.setDate(d.getDate() - 1);
        } else break;
    }

    // Best day
    var dayTotals = {};
    logsFor.forEach(function(l) {
        dayTotals[l.date] = (dayTotals[l.date] || 0) + l.value;
    });
    var bestDay = { date: '', value: 0 };
    Object.keys(dayTotals).forEach(function(d) {
        if (dayTotals[d] > bestDay.value) { bestDay = { date: d, value: dayTotals[d] }; }
    });

    // Average per day (last 30 days with logs)
    var todayMs = new Date().getTime();
    var thirtyDays = {};
    for (var i = 0; i < 30; i++) {
        var ds = new Date(todayMs - i * 86400000).toISOString().slice(0, 10);
        var dayTotal = logsFor.filter(function(l) { return l.date === ds; }).reduce(function(s, l) { return s + l.value; }, 0);
        if (dayTotal > 0) thirtyDays[ds] = dayTotal;
    }
    var total30 = Object.values(thirtyDays).reduce(function(s, v) { return s + v; }, 0);
    var avg30 = Object.keys(thirtyDays).length > 0 ? Math.round(total30 / Object.keys(thirtyDays).length) : 0;

    document.getElementById('statsGrid').innerHTML =
        '<div class="stat-card"><div class="num">' + total + '</div><div class="label">Total</div></div>' +
        '<div class="stat-card"><div class="num">' + streak + '</div><div class="label">Day Streak</div></div>' +
        '<div class="stat-card"><div class="num">' + avg30 + '</div><div class="label">Avg / Day</div></div>' +
        '<div class="stat-card"><div class="num">' + bestDay.value + '</div><div class="label">Best Day</div></div>';

    // Chart (last 14 days)
    var chart = document.getElementById('chartContainer');
    var maxVal = 1;
    var bars = [];
    for (var i = 14; i >= 0; i--) {
        var ds = new Date(todayMs - i * 86400000).toISOString().slice(0, 10);
        var dayTotal = logsFor.filter(function(l) { return l.date === ds; }).reduce(function(s, l) { return s + l.value; }, 0);
        if (dayTotal > maxVal) maxVal = dayTotal;
        bars.push({ date: ds, value: dayTotal });
    }

    var chartHtml = '';
    bars.forEach(function(b) {
        var pct = Math.max((b.value / maxVal) * 100, b.value > 0 ? 4 : 0);
        var dayLabel = b.date.slice(5);
        var dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(b.date).getDay()];
        chartHtml += '<div class="chart-bar">';
        chartHtml += '<span class="date-label">' + dayName + '</span>';
        chartHtml += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
        chartHtml += '<span class="bar-val">' + b.value + '</span>';
        chartHtml += '</div>';
    });
    chart.innerHTML = chartHtml;
}

// ---- MANAGE ----
function renderActivities() {
    var container = document.getElementById('activityList');
    if (activities.length === 0) {
        container.innerHTML = '<div class="text-muted">No activities yet. Add some!</div>';
        return;
    }
    var html = '';
    activities.forEach(function(a) {
        var isDefault = DEFAULT_ACTIVITIES.some(function(d) { return d.id === a.id; });
        html += '<div class="aitem">';
        html += '<div><span>' + (a.icon || '📌') + '</span> <span class="aname">' + a.name + '</span> <span class="aunit">(' + a.unit + ')</span></div>';
        if (!isDefault) {
            html += '<button class="btn btn-sm btn-danger" onclick="deleteActivity(\'' + a.id + '\')">✕</button>';
        } else {
            html += '<span class="text-muted" style="font-size:0.75rem;">default</span>';
        }
        html += '</div>';
    });
    container.innerHTML = html;
}

function deleteActivity(id) {
    if (!confirm('Delete this activity and all its logs?')) return;
    activities = activities.filter(function(a) { return a.id !== id; });
    logs = logs.filter(function(l) { return l.activityId !== id; });
    saveData();
    renderActivities();
    populateActivitySelects();
    renderTodayLogs();
}

function openAddModal() {
    document.getElementById('addModal').classList.add('active');
    document.getElementById('newName').value = '';
    document.getElementById('newUnit').value = '';
    setTimeout(function() { document.getElementById('newName').focus(); }, 100);
}

function closeAddModal() {
    document.getElementById('addModal').classList.remove('active');
}

function saveNewActivity() {
    var name = document.getElementById('newName').value.trim();
    var unit = document.getElementById('newUnit').value.trim();
    if (!name) { alert('Enter a name'); return; }
    if (!unit) { alert('Enter a unit (e.g. reps, pages, minutes)'); return; }

    var icon = '📌';
    var lc = name.toLowerCase();
    if (lc.includes('push') || lc.includes('press')) icon = '💪';
    else if (lc.includes('sit') || lc.includes('crunch')) icon = '🔄';
    else if (lc.includes('squat') || lc.includes('leg')) icon = '🦵';
    else if (lc.includes('pull') || lc.includes('chin')) icon = '⬆️';
    else if (lc.includes('run') || lc.includes('jog')) icon = '🏃';
    else if (lc.includes('walk')) icon = '🚶';
    else if (lc.includes('read') || lc.includes('book') || lc.includes('page')) icon = '📖';
    else if (lc.includes('water') || lc.includes('drink')) icon = '💧';
    else if (lc.includes('meditat') || lc.includes('mind')) icon = '🧘';
    else if (lc.includes('yoga') || lc.includes('stretch')) icon = '🤸';
    else if (lc.includes('weight') || lc.includes('gym')) icon = '🏋️';
    else if (lc.includes('bike') || lc.includes('cycle')) icon = '🚴';
    else if (lc.includes('swim')) icon = '🏊';
    else if (lc.includes('dumbbell') || lc.includes('curl')) icon = '💪';
    else icon = '✅';

    activities.push({ id: getNextId(), name: name, unit: unit, icon: icon });
    saveData();
    closeAddModal();
    renderActivities();
    populateActivitySelects();
    showToast('✅ Activity added!');
}

// ---- UTILS ----
function switchPage(name) {
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });

    if (name === 'log') {
        document.getElementById('pageLog').classList.add('active');
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        renderTodayLogs();
    } else if (name === 'stats') {
        document.getElementById('pageStats').classList.add('active');
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        renderStats();
    } else if (name === 'manage') {
        document.getElementById('pageManage').classList.add('active');
        document.querySelectorAll('.nav-btn')[2].classList.add('active');
        renderActivities();
    }
}

function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:0.5rem 1.2rem;border-radius:8px;font-weight:600;z-index:300;animation:fade 1.5s forwards;';
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 1500);
}

function exportData() {
    var data = JSON.stringify({ activities: activities, logs: logs, exported: new Date().toISOString() }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'tracker-export-' + today() + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function importData(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            if (data.activities && data.logs) {
                activities = data.activities;
                logs = data.logs;
                saveData();
                populateActivitySelects();
                renderActivities();
                renderTodayLogs();
                showToast('✅ Imported!');
            } else {
                alert('Invalid file format.');
            }
        } catch(err) {
            alert('Could not read file: ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function clearAllData() {
    if (!confirm('Delete ALL data? This cannot be undone.')) return;
    if (!confirm('Are you sure? All activities and logs will be lost forever.')) return;
    activities = [];
    logs = [];
    saveData();
    // Re-add defaults
    DEFAULT_ACTIVITIES.forEach(function(def) {
        activities.push({ id: def.id, name: def.name, unit: def.unit, icon: def.icon });
    });
    saveData();
    populateActivitySelects();
    renderActivities();
    renderTodayLogs();
    showToast('🗑️ Reset to defaults');
}

loadData();
document.getElementById('todayDate').textContent = todayStr();
populateActivitySelects();
onLogActivityChange();
renderTodayLogs();

// Add CSS animation

style.textContent = '@keyframes fade { 0%{opacity:1} 80%{opacity:1} 100%{opacity:0} }';
document.head.appendChild(style);

// Storage-changed sync event for same-tab
window.addEventListener('storage', function(e) {
    if (e.key === STORAGE_KEY) {
        loadData();
        if (document.getElementById('pageLog').classList.contains('active')) renderTodayLogs();
        if (document.getElementById('pageStats').classList.contains('active')) renderStats();
        if (document.getElementById('pageManage').classList.contains('active')) renderActivities();
    }
});
</script>
